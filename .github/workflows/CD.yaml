name: CD

# main deploys to api (production), develop deploys to beta.
# The shared workflow is FINTLabs/fint-core-workflows branch-deploy.yaml.
#
# The image is tagged sha-<last commit that changed app-paths>. Keep app-paths the
# same as APP_PATHS in .github/scripts/paths.sh, which CI uses.
on:
  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  cd:
    uses: FINTLabs/fint-core-workflows/.github/workflows/branch-deploy.yaml@v1
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      app-paths: src build.gradle settings.gradle gradle.properties gradle gradlew gradlew.bat Dockerfile
