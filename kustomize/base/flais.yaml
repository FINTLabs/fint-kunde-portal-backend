apiVersion: fintlabs.no/v1alpha1
kind: Application
metadata:
  name: fint-kunde-portal-backend
  namespace: fintlabs-no
  labels:
    app.kubernetes.io/name: fint-kunde-portal-backend
    app.kubernetes.io/instance: fint-kunde-portal-backend_fintlabs_no
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fint-core
    fintlabs.no/team: core
    fintlabs.no/org-id: fintlabs.no
spec:
  port: 8080
  orgId: fintlabs.no
  # The tag is replaced by CD with sha-<commit>, see .github/workflows/CD.yaml.
  image: ghcr.io/fintlabs/fint-kunde-portal-backend:latest
  onePassword:
    itemPath: vaults/aks-beta-vault/items/kunde-portal
  env:
    - name: JAVA_TOOL_OPTIONS
      value: '-XX:+ExitOnOutOfMemoryError -Xmx1800M'
    - name: 'fint.portal.tests.test-runner'
      value: 'http://fint-test-runner:8080'
    - name: LOGGING_LEVEL_ROOT
      value: 'INFO'
    # Feature flags, see FeatureProperties.kt. A flag that is not set is enabled.
    - name: 'feature.flags.oauth-credentials-create'
      value: 'true'
    - name: 'feature.flags.oauth-credentials-delete'
      value: 'true'
  probes:
    startup:
      path: /api/actuator/health
      port: 8080
      initialDelaySeconds: 15
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 10
  resources:
    limits:
      memory: "2Gi"
    requests:
      memory: "1Gi"
      cpu: "250m"
  observability:
    metrics:
      enabled: true
      port: "8080"
      path: /api/actuator/prometheus
